name: Mise à jour de la veille

on:
  schedule:
    - cron: "0 6 * * *"   # tous les jours à 6h00 UTC (7h ou 8h en France)
  workflow_dispatch:       # permet aussi de le lancer à la main
  push:
    paths:
      - "veille.py"        # relance quand le script est modifié

permissions:
  contents: write          # nécessaire pour enregistrer veille.json dans le dépôt

jobs:
  veille:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer l'outil de veille
        run: python veille.py --jours 30

      - name: Enregistrer les résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.json veille.md
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour automatique de la veille"
            git push
          fi
